name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pyflakes (Ubuntu package, not pip)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyflakes
      - name: Install actionlint (pinned release, checksum verified)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Lint (pyflakes, actionlint)
        run: python3 -m pyflakes ./*.py && /tmp/actionlint
      - name: Tests
        run: python3 -m unittest test_duel_clock_server
